<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ICT Department SIWES Survey 2026</title>
    <link rel="icon"  type="Image/png" href="Afit logo.png">
    <link rel="stylesheet" href="survey.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body>
    <div class="survey-container">
        <header>
            <a href="index.html" class="logo">
                <div class="logo">
                    <img src="Afit logo.png" alt="logo" style="width: 50px; height: auto;">
                    <span>AIR FORCE INSTITUTE OF TECHNOLOGY KADUNA-NIGERIA</span>
                </div>
            </a>
            <h1>DEPARTMENT OF INFORMATION AND COMMUNICATION TECHNOLOGY</h1>
            <h2>SIWES Experience Feedback Survey 2026</h2>
            <p>Your feedback is greatly needed.</p>
        </header>
        <form action="https://formspree.io/f/mzebbdwo" method="post">
            <input type="hidden" name="-subject" value="New ICT Survey Response">
            <div class="form-group">
                <label for="matric no">Matriculation No:</label>
                <input type="text" id="matric no" name="matric no" placeholder="U23ICT0000"><br>
            </div>
            <div class="form-group">
                <label for="placement type">SIWES Placement Type:</label>
                <select name="placement type"  id="placement type" required>
                    <option value="">-- Select --</option>
                    <option value="Tech Company/Software Firm">Tech Company/Software Firm</option>
                    <option value="Telecommunication">Telecommunication</option>
                    <option value="Government Agency">Government Agency</option>
                    <option value="School/Hospital ICT Unit">School/Hospital ICT Unit</option>
                    <option value="Other">Other</option><br>
                </select>
            </div>
            <div class="form-group">
                <label>Rate your overall SIWES Experience:</label>
                <div class="radio-group">
                    <label><input type="radio" name="rating" value="1" required> 1- Poor</label><br>
                    <label><input type="radio" name="rating" value="2" required> 2- Fair</label><br>
                    <label><input type="radio" name="rating" value="3" required> 3- Good</label><br>
                    <label><input type="radio" name="rating" value="4" required> 4- Very Good</label><br>
                    <label><input type="radio" name="rating" value="5" required> 5- Excellent</label><br>
                </div>
            </div>
            <div class="form-group">
                <label>What ICT skills did you gain? :</label>
                <div class="checkbox-group">
                    <label><input type="checkbox" name="skills">Web Development-HTML,CSS,JS</label><br>
                    <label><input type="checkbox" name="skills">Networking & Server Management</label><br>
                    <label><input type="checkbox" name="skills">Database Management</label><br>
                    <label><input type="checkbox" name="skills">Cybersecurity</label><br>
                    <label><input type="checkbox" name="skills">AI & Machine learning</label><br>
                    <label><input type="checkbox" name="skills">Technical & Troubleshooting</label><br>
                    <label><input type="checkbox"name="skills">Graphic Design</label><br>
                    <label><input type="checkbox" name="skills">Other</label><br>
                </div>
            </div>
            <div class="form-group">
                <label>What were your major challenges during SIWES? :</label><br>
                <textarea rows="3" placeholder="e.g Transportation,No proper mentorship,Lack of tools..."></textarea>
            </div>
            <div class="form-group">
                <label>Would you recommend your SIWES company to other ICT students? :</label>
                <div class="radio-group">
                    <label><input type="radio" name="recommend" value="Yes">Yes</label><br>
                    <label><input type="radio" name="recommend" value="No">No</label><br>
                </div>
            </div>
            <button type="submit" class="submit-btn">
                <i fa-solid fa-paper-plane></i>Submit Feedback
            </button>
        </form>

        <footer>
            <p>&copy; 2026 Department of ICT.All responses are confidential.</p>
        </footer>
    </div>
</body>
</html>
