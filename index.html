<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ICT Department SIWES Survey 2026</title>
    <link rel="icon"  type="Image/png" href="assets/images/Afit logo.png">
    <link rel="stylesheet" href="survey.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body>
    <div class="survey-container">
        <header>
            <a href="index.html" class="logo">
                <div class="logo">
                    <img src="assets/images/Afit logo.png" alt="logo" style="width: 50px; height: auto;">
                    <span>AIR FORCE INSTITUTE OF TECHNOLOGY KADUNA-NIGERIA</span>
                </div>
            </a>
            <h1>DEPARTMENT OF INFORMATION AND COMMUNICATION TECHNOLOGY</h1>
            <h2>SIWES Experience Feedback Survey 2026</h2>
            <p>Your feedback is greatly needed.</p>
        </header>
        <form action="https://formspree.io/f/mzebbdwo" method="post">
            <input type="hidden" name="-subject" value="New ICT Survey Response">
            <div class="form-group">
                <label for="matric no">Matriculation No:</label>
                <input type="text" id="matric no" placeholder="U23ICT0000"><br>
            </div>
            <div class="form-group">
                <label>SIWES Placement Type:</label>
                <select required>
                    <option value="">-- Select --</option>
                    <option>Tech Company/Software Firm</option>
                    <option>Telecommunication</option>
                    <option>Government Agency</option>
                    <option>School/Hospital ICT Unit</option>
                    <option>Other</option><br>
                </select>
            </div>
            <div class="form-group">
                <label>Rate your overall SIWES Experience:</label>
                <div class="radio-group">
                    <label><input type="radio" name="rating" required> 1- Poor</label><br>
                    <label><input type="radio" name="rating" required> 2- Fair</label><br>
                    <label><input type="radio" name="rating" required> 3- Good</label><br>
                    <label><input type="radio" name="rating" required> 4- Very Good</label><br>
                    <label><input type="radio" name="rating" required> 5- Excellent</label><br>
                </div>
            </div>
            <div class="form-group">
                <label>What ICT skills did you gain? :</label>
                <div class="checkbox-group">
                    <label><input type="checkbox">Web Development-HTML,CSS,JS</label><br>
                    <label><input type="checkbox">Networking & Server Management</label><br>
                    <label><input type="checkbox">Database Management</label><br>
                    <label><input type="checkbox">Cybersecurity</label><br>
                    <label><input type="checkbox">AI & Machine learning</label><br>
                    <label><input type="checkbox">Technical & Troubleshooting</label><br>
                    <label><input type="checkbox">Graphic Design</label><br>
                </div>
            </div>
            <div class="form-group">
                <label>What were your major challenges during SIWES? :</label><br>
                <textarea rows="3" placeholder="e.g Transportation,No proper mentorship,Lack of tools..."></textarea>
            </div>
            <div class="form-group">
                <label>Would you recommend your SIWES company to other ICT students? :</label>
                <div class="radio-group">
                    <label><input type="radio" name="recommend">Yes</label><br>
                    <label><input type="radio" name="recommend">No</label><br>
                </div>
            </div>
            <button type="submit" class="submit-btn">
                <i fa-solid fa-paper-plane></i>Submit Feedback
            </button>
        </form>

        <footer>
            <p>&copy; 2026 Department of ICT.All responses are confidential.</p>
        </footer>
    </div>
</body>
</html>
