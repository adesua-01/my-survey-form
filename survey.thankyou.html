<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Thank You - ICT SIWES Survey</title>
    <link rel="stylesheet" href="css/survey.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">

    <style>
        .success-icon {
            font-size: 70px;
            color: #4CAF50;
            animation: bounce 1s ease;
        }
        @keyframes bounce {
            0%, 20%, 50%, 80%,100% {transform: translateY(0);}
            40% {transform: translateY(-20px);}
            60% {transform: translateY(-10px);}
        }
    </style>
</head>
<body>
   <div class="survey-container" style="text-align: center;">
        <header style="border: none;">
            <div class="success-icon"><i class="fa-solid fa-circle-check"></i></div>
            <h2 style="color: #4CAF50; font-size:28px;">Submission Received!</h2>
            <p style="font-size: 16px; margin: 15px 0;">Thank you for completing the SIWES Feedbacl Survey.</p>
            <p>Your response has been sent to the <strong>Department</strong>.</p>
        </header>
        <div style="background: #f5f7ff; padding: 15px; border-radius: 10px; margin: 20px 0;">
            <p><i class="fa-solid fa-envelope"></i>A copy of your response was sent to the coordinator.</p>
        </div>
        <a href="survey.html" class="submit-btn" style="text-decoration: none; display: inline-flex; margin-top: 10px;">
            <i class="fa-solid fa-arrow-rotate-left">Submit Another Response</i>
        </a>
        <footer>
            <p>&copy; 2026 Department of ICT,AFIT. All responses are confidential</p>
        </footer>
   </div> 
</body>
</html>
